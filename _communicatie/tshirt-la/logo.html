<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=block" rel="stylesheet">
<style>
  :root { --ink: #ffffff; --bg: #1f6fa8; --sky: #1f6fa8; --snow: #ffffff; --shade: #c9d6e8;
          --be-black: #111111; --be-yellow: #fdda24; --be-red: #ef3340;
          }
  body.light { --ink: #0b2c5c; --bg: transparent; }
  body.dark  { --bg: transparent; --sky: transparent; }
  /* single-ink versions: everything in --ink, the shirt shows through the gaps */
  body.mono-black, body.mono-white { --bg: transparent; --sky: transparent; }
  .mono-only { display: none; }
  body.mono-black .mono-only, body.mono-white .mono-only { display: inline; }
  body.mono-black .color-only, body.mono-white .color-only { display: none; }
  body.mono-black { --ink: #000000; }
  body.mono-white { --ink: #ffffff; }
  html, body { margin: 0; background: transparent; }
  #logo {
    width: 1200px; padding: 70px 0 60px; background: var(--bg);
    display: flex; flex-direction: column; align-items: center;
    font-family: 'Montserrat', 'Arial Black', sans-serif; color: var(--ink);
  }
  .year { display: flex; align-items: center; font-weight: 900; font-size: 400px; line-height: .8; letter-spacing: -6px; }
  .year .zero { width: 300px; height: 300px; margin: 0 14px 0 10px; }
  .url { margin-top: 48px; font-weight: 700; font-size: 66px; letter-spacing: 14px; padding-left: 14px; }
  /* partners: 2 x 2 grid under the logo, all in the ink colour */
  .sponsors { margin-top: 80px; display: grid; grid-template-columns: 500px 500px; gap: 44px 72px; }
  .sponsors .cell { height: 170px; display: flex; align-items: center; justify-content: center; color: var(--ink); }
  .sponsors .sp { display: block; }
  .sp.imec { width: 330px; }
  .sp.cronos { height: 160px; }
  .sp.lrd { width: 480px; }
  .invite { border: 7px solid var(--ink); border-radius: 22px; padding: 16px 30px 18px; text-align: center; }
  .invite .big { font-weight: 900; font-size: 40px; line-height: 1.15; white-space: nowrap; }
  .invite .small { margin-top: 6px; font-weight: 700; font-size: 24px; letter-spacing: 3px; line-height: 1.2; }
</style>
</head>

<div id="logo">

          <path d="M50.5 23 C53 26 54 28 52.5 30.5 C51.5 32 48.5 32 47.8 30.5 C47 28.5 48.5 26.5 50.5 23 Z" fill="#000"/>

        </mask>
      </defs>
      <circle cx="50" cy="50" r="43.4" fill="none" stroke="var(--ink)" stroke-width="13.2"/>
      <g clip-path="url(#inner)">
        <rect width="100" height="100" fill="var(--sky)"/>
        <g class="color-only">

        <path d="M51 14 C57 21 59 26 56 31 C54 34 47 34 45 31 C42 26 46 22 47 18 C48 21 49 22 50 22 C51 19 51 17 51 14 Z" fill="var(--be-yellow)"/>

        <g fill="none" stroke-width="6.5">
          <path d="M0 76 Q50 62 100 68" stroke="var(--be-black)"/>
          <path d="M0 85.5 Q50 71.5 100 77.5" stroke="var(--be-yellow)"/>
          <path d="M0 95 Q50 81 100 87" stroke="var(--be-red)"/>

            <path d="M0 85.5 Q50 71.5 100 77.5"/>
            <path d="M0 95 Q50 81 100 87"/>
          </g>
        </g>
      </g>
    </svg>
