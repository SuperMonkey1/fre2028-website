<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 600 230" width="600" height="230">
  <defs>
    <style type="text/css">
      <![CDATA[
      .bg { fill: #0B0D11; rx: 14px; }
      .border { stroke: #212631; stroke-width: 1.5px; fill: none; rx: 14px; }
      
      .label-text {
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        text-anchor: middle;
      }
      
      /* Line 1: Primary Brand Anchor - Pure Centered */
      .line-1 {
        font-weight: 900;
        font-size: 38px;
        fill: #FFFFFF;
        letter-spacing: 2px;
      }
      
      /* TM Mark: Elevated superscript */
      .tm-mark {
        font-weight: 700;
        font-size: 11px;
        fill: #94A3B8;
        letter-spacing: 1px;
        text-anchor: start;
      }
      
      /* Brand Endorsement Subtitle */
      .brand-endorsement {
        font-weight: 700;
        font-size: 12px;
        fill: #94A3B8;
        letter-spacing: 2.5px;
      }
      
      /* Line 2: Creator Authority */
      .line-2 {
        font-weight: 500;
        font-size: 14.5px;
        fill: #94A3B8;
        letter-spacing: 2.2px;
      }
      
      /* Line 3: Campaign Tagline - Athletic Oblique/Italic */
      .line-3 {
        font-weight: 500;
        font-style: italic;
        font-size: 14.5px;
        fill: #E2E8F0;
        letter-spacing: 0.8px;
      }
      
      /* Line 4: Clean URL and Provenance Reference */
      .line-4 {
        font-weight: 700;
        font-size: 12px;
        fill: #94A3B8;
        letter-spacing: 2.2px;
      }

      .divider {
        stroke: #262D3D;
        stroke-width: 1.2px;
      }
      ]]>
    </style>
  </defs>

  <!-- Hardware Badge Base Plate -->
  <rect width="570" height="200" x="15" y="15" class="bg" />
  <rect width="570" height="200" x="15" y="15" class="border" />

  <!-- Line 1: SLOPER KING (100% Mathematically Centered at x=300) -->
  <text x="300" y="66" class="label-text line-1">SLOPER KING</text>

  <!-- TM Mark: Elevated higher to y=40 right at the top shoulder of the 'G' -->
  <text x="435" y="40" class="label-text tm-mark">TM</text>

  <!-- Brand Endorsement directly under SLOPER KING: A BAMBUM INNOVATION -->
  <text x="300" y="88" class="label-text brand-endorsement">A BAMBUM INNOVATION</text>

  <!-- Precision Technical Divider -->
  <line x1="175" y1="104" x2="425" y2="104" class="divider" />

  <!-- Line 2: BY FRÉ LEYS (Centered) -->
  <text x="300" y="130" class="label-text line-2">BY FRÉ LEYS</text>

  <!-- Line 3: Engineering my way to the Paralympics (Italic) -->
  <text x="300" y="158" class="label-text line-3">Engineering my way to the Paralympics</text>

  <!-- Line 4: Single Clear Destination URL -->
  <text x="300" y="192" class="label-text line-4">WWW.FRE2028.LA • BELGIUM</text>
</svg>
